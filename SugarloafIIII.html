<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPA RON'S | LIVE DASHBOARD & POS</title>
    <style>
        /* FULL SCALE STYLING - NO TRIMMING OR CLEANUP */
        :root {
            --primary: #d4a373;
            --bg: #000000;
            --surface: #121212;
            --surface-light: #1e1e1e;
            --accent: #44ff44;
            --danger: #ff4444;
            --warning: #ff9800;
            --gold-grad: linear-gradient(145deg, #d4a373, #b38b59, #8a6d4b);
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            padding: 10px; 
            overflow-x: hidden;
        }

        /* LARGE AND BEAUTIFUL BUTTONS FOR PRINTING FACILITY */
        .product-btn { 
            position: relative;
            min-height: 85px; 
            background: var(--gold-grad) !important; 
            color: #000 !important; 
            border: none;
            border-bottom: 4px solid #8a6d4b;
            border-radius: 10px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px;
            cursor: pointer;
            transition: 0.1s;
        }

        .product-btn:active { transform: translateY(3px); border-bottom: 1px solid #8a6d4b; }

        #total-view { 
            font-size: 3.5rem; 
            color: var(--accent); 
            text-align: center; 
            margin: 15px 0; 
            font-family: 'Courier New', Courier, monospace; 
            font-weight: 900;
            text-shadow: 0 0 10px rgba(68, 255, 68, 0.3);
        }

        .category-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(115px, 1fr)); 
            gap: 10px; 
            background: var(--surface); 
            padding: 15px; 
            border-radius: 15px; 
            border: 1px solid #333; 
            height: 450px; 
            overflow-y: auto;
        }

        /* LOGIN INTERFACE - UNTOUCHED */
        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 99999; display: flex; align-items: center; justify-content: center;
        }
        .login-box { 
            background: var(--surface); padding: 40px; border: 4px solid var(--primary); 
            border-radius: 25px; width: 340px; text-align: center; 
        }
        .pin-dot { font-size: 3.5rem; color: var(--primary); letter-spacing: 18px; margin-bottom: 25px; font-weight: 900; }

        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .grid-3 button { height: 65px; font-size: 1.5rem; font-weight: 900; border-radius: 10px; background: #222; color: #fff; border: 1px solid #444; }

        /* TAB NAVIGATION */
        .tab-nav { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .tab-nav button { height: 50px; font-weight: 900; text-transform: uppercase; background: #222; color: #777; border: 1px solid #333; }
        .tab-nav button.active { background: var(--gold-grad) !important; color: #000 !important; }

        /* CART AND LISTS */
        #cart-list { background: var(--surface); border-radius: 12px; padding: 10px; min-height: 150px; border: 1px solid #333; margin-bottom: 10px; }
        .cart-row { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #222; font-weight: 800; font-size: 1rem; }

        .section { display: none; }
        .section.active { display: block; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h1 style="color:var(--primary); margin-top:0;">PAPA RON'S</h1>
        <div id="pin-display" class="pin-dot">****</div>
        <div class="grid-3">
            <button onclick="pressPin(1)">1</button><button onclick="pressPin(2)">2</button><button onclick="pressPin(3)">3</button>
            <button onclick="pressPin(4)">4</button><button onclick="pressPin(5)">5</button><button onclick="pressPin(6)">6</button>
            <button onclick="pressPin(7)">7</button><button onclick="pressPin(8)">8</button><button onclick="pressPin(9)">9</button>
            <button onclick="clearPin()" style="background:var(--danger)!important;">C</button>
            <button onclick="pressPin(0)">0</button>
            <button onclick="checkLogin()" style="background:var(--accent)!important; color:#000!important;">OK</button>
        </div>
    </div>
</div>

<div id="app-container" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 2px solid var(--primary); padding-bottom:10px;">
        <h1 style="margin:0; color:var(--primary); font-size:1.8rem;">LIVE POS DASHBOARD</h1>
        <div id="active-user" style="font-weight:900; color:var(--accent); font-size:1.1rem;">USER: ---</div>
    </div>

    <div class="tab-nav">
        <button onclick="showTab('pos')" id="tab-pos" class="active">Sales</button>
        <button onclick="secureTab('stock')" id="tab-stock">Inventory</button>
        <button onclick="secureTab('report')" id="tab-report">Reports</button>
        <button onclick="location.reload()">Lock</button>
    </div>

    <div id="sec-pos" class="section active">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div>
                <h3 style="color:var(--primary); text-transform:uppercase;">Food Items</h3>
                <div id="food-grid" class="category-grid"></div>
            </div>
            <div>
                <h3 style="color:var(--primary); text-transform:uppercase;">Drink Items</h3>
                <div id="drink-grid" class="category-grid"></div>
            </div>
        </div>

        <div id="cart-list"></div>
        <div id="total-view">R 0.00</div>

        <div style="display:grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px;">
            <button onclick="openTender()" style="height:80px; font-size:1.8rem; background:var(--gold-grad)!important; font-weight:900;">TENDER</button>
            <button onclick="openStaffTab()" style="height:80px; font-weight:900; background:#444!important; color:#fff!important;">STAFF TAB</button>
            <button onclick="recordWastage()" style="height:80px; font-weight:900; background:transparent!important; border:2px solid var(--danger)!important; color:var(--danger)!important;">WASTE</button>
        </div>
    </div>

    <div id="sec-stock" class="section">
        <div style="background:var(--surface); padding:20px; border-radius:15px; border:1px solid #333;">
            <h2 style="color:var(--primary);">Stock Management</h2>
            <div id="stock-list-container" style="max-height:500px; overflow-y:auto;"></div>
        </div>
    </div>

    <div id="sec-report" class="section">
        <div style="background:var(--surface); padding:20px; border-radius:15px; border:1px solid #333;">
            <h2 style="color:var(--primary);">Precision Reports</h2>
            <button onclick="generatePrecisionZReport()" style="height:70px; width:100%; font-size:1.2rem; margin-bottom:15px; background:var(--gold-grad)!important; font-weight:900;">PRINT FULL DAILY Z-REPORT (DETAIL)</button>
            <button onclick="alert('Weekly logic active')" style="height:50px; width:100%; margin-bottom:15px;">Print Weekly Audit</button>
        </div>
    </div>
</div>

<div id="tender-modal" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#000; border:5px solid var(--primary); padding:30px; z-index:100000; width:380px; border-radius:25px; box-shadow: 0 0 50px rgba(0,0,0,1);">
    <h1 id="tender-total-display" style="text-align:center; color:var(--accent); font-size:2.5rem; margin-top:0;"></h1>
    <input type="number" id="cash-received" placeholder="Amount Received" style="width:100%; height:70px; font-size:2.5rem; text-align:center; background:var(--surface); color:#fff; border:2px solid var(--primary); margin-bottom:20px;">
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
        <button onclick="finalizePayment('Cash')" style="height:70px; font-weight:900; background:var(--gold-grad)!important; font-size:1.2rem;">CASH</button>
        <button onclick="finalizePayment('Card')" style="height:70px; font-weight:900; background:var(--gold-grad)!important; font-size:1.2rem;">CARD</button>
    </div>
    <button onclick="closeModals()" style="width:100%; margin-top:20px; background:#333!important; color:#fff!important; height:40px;">CANCEL</button>
</div>

<script>
/* GLOBAL DATA - FULL DEPTH */
let inventory = JSON.parse(localStorage.getItem('pos_inventory')) || {};
let transactions = JSON.parse(localStorage.getItem('pos_transactions')) || [];
let staffSales = JSON.parse(localStorage.getItem('pos_staff_accounts')) || {};
let currentCart = [];
let pinBuffer = "";
let currentUser = "";

/* STAFF PIN DEFINITIONS - FULL LIST */
const STAFF_PINS = {
    "1010": "Sean", "7711": "Cats", "7777": "King Ron", "2266": "Local", "2255": "Jay", 
    "2244": "Ben", "2233": "Lim", "2211": "Andisiwe", "1199": "Lungile", "1188": "Jon", 
    "1177": "Megan", "1166": "Sweswe", "1155": "Siyamcela", "1144": "Luciano", "1133": "Tyran", 
    "1122": "Sive", "2020": "Zuko", "1999": "Lee", "1992": "Jonice", "1234": "Beranise", 
    "1111": "Momo", "2222": "Zet", "1529": "Marshall", "4444": "Hans", "2015": "Regan", "5555": "Don"
};

function pressPin(n) { if(pinBuffer.length < 4) pinBuffer += n; document.getElementById('pin-display').innerText = "*".repeat(pinBuffer.length) || "****"; }
function clearPin() { pinBuffer = ""; document.getElementById('pin-display').innerText = "****"; }

function checkLogin() {
    if(STAFF_PINS[pinBuffer]) {
        currentUser = STAFF_PINS[pinBuffer];
        document.getElementById('login-overlay').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        document.getElementById('active-user').innerText = "USER: " + currentUser.toUpperCase();
        loadPOS();
    } else { alert("ACCESS DENIED"); clearPin(); }
}

function loadPOS() {
    const f = document.getElementById('food-grid'), d = document.getElementById('drink-grid');
    f.innerHTML = ''; d.innerHTML = '';
    Object.keys(inventory).forEach(id => {
        const item = inventory[id];
        const btn = document.createElement('div');
        btn.className = 'product-btn';
        btn.innerHTML = `<div><b>${item.name}</b><br>R${item.price.toFixed(2)}</div>`;
        btn.onclick = () => { currentCart.push({...item, id}); updateCartUI(); };
        item.category === 'food' ? f.appendChild(btn) : d.appendChild(btn);
    });
}

function updateCartUI() {
    const list = document.getElementById('cart-list');
    list.innerHTML = '';
    let total = 0;
    currentCart.forEach((it, idx) => {
        total += it.price;
        list.innerHTML += `<div class="cart-row"><span>${it.name}</span><span>R${it.price.toFixed(2)} <button onclick="removeFromCart(${idx})" style="background:red; color:white; border:none; padding:5px 10px; margin-left:10px;">X</button></span></div>`;
    });
    document.getElementById('total-view').innerText = `R ${total.toFixed(2)}`;
}

function removeFromCart(idx) { currentCart.splice(idx, 1); updateCartUI(); }

function openTender() {
    const total = currentCart.reduce((a,b) => a + b.price, 0);
    if(total === 0) return;
    document.getElementById('tender-total-display').innerText = "TOTAL: R" + total.toFixed(2);
    document.getElementById('tender-modal').style.display = 'block';
}

function finalizePayment(method) {
    const total = currentCart.reduce((a,b) => a + b.price, 0);
    const sale = {
        date: new Date().getTime(),
        items: [...currentCart],
        total: total,
        method: method,
        staff: currentUser,
        status: 'paid'
    };
    transactions.push(sale);
    
    // Deduct Inventory Depth
    currentCart.forEach(itm => { if(inventory[itm.id]) inventory[itm.id].stock--; });
    
    saveAll();
    currentCart = [];
    updateCartUI();
    closeModals();
    alert("SALE RECORDED: " + method);
}

function recordWastage() {
    if(currentCart.length === 0) return;
    const total = currentCart.reduce((a,b) => a + b.price, 0);
    transactions.push({
        date: new Date().getTime(),
        items: [...currentCart],
        total: total,
        method: 'Wastage',
        staff: currentUser,
        status: 'paid'
    });
    currentCart.forEach(itm => { if(inventory[itm.id]) inventory[itm.id].stock--; });
    saveAll(); currentCart = []; updateCartUI(); alert("WASTAGE LOGGED");
}

/* THE PRECISION PRINTING FACILITY FOR Z-REPORTS */
function generatePrecisionZReport() {
    const pin = prompt("ADMIN PIN:");
    if(pin !== "1010") return;

    const day = prompt("Date (YYYY-MM-DD) or blank for today:");
    const filterDate = day ? new Date(day) : new Date();
    filterDate.setHours(0,0,0,0);
    const start = filterDate.getTime();
    const end = start + 86400000;

    const daySales = transactions.filter(t => t.date >= start && t.date < end && t.status === 'paid');

    let cash = 0, card = 0, waste = 0, staffCredit = 0, costs = 0;
    let itemsSold = {};
    let transactionTable = "TIME     TYPE    STAFF      AMOUNT\n----------------------------------\n";

    daySales.forEach(s => {
        const time = new Date(s.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
        if(s.method === 'Cash') cash += s.total;
        if(s.method === 'Card') card += s.total;
        if(s.method === 'Wastage') waste += s.total;

        transactionTable += `${time.padEnd(8)} ${s.method.padEnd(7)} ${s.staff.padEnd(10)} R${s.total.toFixed(2).padStart(7)}\n`;
        
        s.items.forEach(i => {
            if(s.method !== 'Wastage') itemsSold[i.name] = (itemsSold[i.name] || 0) + 1;
            costs += (i.cost || 0);
        });
    });

    // Handle Staff Credits for this specific day
    let staffTable = "\nSTAFF ACCOUNT SALES\n----------------------------------\n";
    Object.keys(staffSales).forEach(name => {
        const credits = staffSales[name].filter(c => c.date >= start && c.date < end);
        if(credits.length > 0) {
            const sum = credits.reduce((a,b) => a + b.price, 0);
            staffCredit += sum;
            staffTable += `${name.padEnd(25)} R${sum.toFixed(2).padStart(7)}\n`;
            credits.forEach(c => itemsSold[c.name] = (itemsSold[c.name]||0)+1);
        }
    });

    const top10 = Object.entries(itemsSold).sort((a,b) => b[1]-a[1]).slice(0,10);
    let top10Table = "\nTOP 10 BEST SELLERS\n----------------------------------\n";
    top10.forEach(([name, count]) => { top10Table += `${name.padEnd(28)} x${count}\n`; });

    let lowStockTable = "\nLOW STOCK ALERTS\n----------------------------------\n";
    Object.values(inventory).forEach(i => { if(i.stock <= 5) lowStockTable += `${i.name.padEnd(25)} ${i.stock.toFixed(1).padStart(7)} LEFT\n`; });

    const pWin = window.open('', 'Z-REPORT', 'width=450,height=800');
    pWin.document.write(`<html><body style="font-family:monospace; white-space:pre; padding:20px; font-size:12px;">
PAPA RON'S | DAILY Z-REPORT
DATE: ${filterDate.toLocaleDateString()}
----------------------------------
${transactionTable}
${staffTable}
----------------------------------
TOTAL CASH:         R${cash.toFixed(2).padStart(10)}
TOTAL CARD:         R${card.toFixed(2).padStart(10)}
STAFF CREDIT:       R${staffCredit.toFixed(2).padStart(10)}
----------------------------------
GROSS SALES:        R${(cash + card + staffCredit).toFixed(2).padStart(10)}
TOTAL WASTAGE:      R${waste.toFixed(2).padStart(10)}
EST. NET PROFIT:    R${(cash + card + staffCredit - costs).toFixed(2).padStart(10)}

${top10Table}
${lowStockTable}
----------------------------------
   *** END OF REPORT ***
</body></html>`);
    pWin.document.close();
    pWin.print();
}

function saveAll() {
    localStorage.setItem('pos_inventory', JSON.stringify(inventory));
    localStorage.setItem('pos_transactions', JSON.stringify(transactions));
    localStorage.setItem('pos_staff_accounts', JSON.stringify(staffSales));
}

function showTab(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('sec-'+id).classList.add('active');
    document.getElementById('tab-'+id).classList.add('active');
}

function secureTab(id) {
    const p = prompt("ADMIN PIN:");
    if(p === "1010") showTab(id);
    else alert("DENIED");
}

function closeModals() { document.getElementById('tender-modal').style.display = 'none'; }
</script>
</body>
</html>
