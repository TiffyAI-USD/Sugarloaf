<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PAPA RON'S | PREMIUM POS</title>
    <style>
        :root {
            --primary: #d4a373;
            --bg: #000000;
            --surface: #121212;
            --surface-light: #1e1e1e;
            --accent: #44ff44;
            --danger: #ff4444;
            --warning: #ff9800;
            --gold-grad: linear-gradient(145deg, #d4a373, #b38b59, #8a6d4b);
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            padding: 8px; 
            overflow-x: hidden;
        }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box { background: var(--surface); padding: 30px; border-radius: 15px; border: 2px solid var(--primary); width: 85%; max-width: 320px; text-align: center; }
        .pin-display { font-size: 2.5rem; letter-spacing: 12px; margin-bottom: 25px; color: var(--primary); font-weight: 900; background: #000; padding: 10px; border-radius: 8px; min-height: 50px; }

        h1 { text-align: center; color: var(--primary); font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0; font-weight: 900; }
        h3 { color: var(--primary); margin: 0; font-weight: 800; text-transform: uppercase; font-size: 0.9rem; }

        input, button, select { 
            font-size: 0.9rem; padding: 12px; margin: 4px 0; width: 100%; 
            border-radius: 6px; box-sizing: border-box; border: 1px solid #333; font-weight: 800;
        }

        button { 
            background: var(--gold-grad) !important; color: #000 !important; border: none !important; 
            cursor: pointer; text-transform: uppercase; font-weight: 900; 
        }
        
        button:active { transform: scale(0.96); opacity: 0.8; }
        
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tab-content { display: none; margin-top: 10px; animation: fadeIn 0.3s ease; }
        .active-tab { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .category-grid { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); 
            gap: 6px; background: var(--surface); padding: 8px; border-radius: 10px; 
            border: 1px solid #222; max-height: 300px; overflow-y: auto;
        }

        .product-btn { 
            position: relative; min-height: 65px; font-size: 0.75rem; color: #000 !important; 
            display: flex; align-items: center; justify-content: center; text-align: center; 
            border-radius: 6px; font-weight: 900; padding: 4px; cursor: pointer;
            text-transform: uppercase; background: var(--gold-grad); border-bottom: 3px solid #8a6d4b;
        }

        #trans-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; }
        .tab-btn { width: auto; padding: 8px 16px; background: #222 !important; color: #777 !important; white-space: nowrap; border: 1px solid #333 !important; font-size: 0.8rem; }
        .tab-btn.active { background: var(--gold-grad) !important; color: #000 !important; border-color: #fff !important; }

        #cart-list { background: var(--surface); border-radius: 8px; padding: 8px; margin: 8px 0; max-height: 200px; overflow-y: auto; border: 1px solid #222; }
        .cart-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 6px 0; align-items: center; font-size: 0.85rem; font-weight: 700; }
        #total-view { font-size: 2.5rem; color: var(--accent); text-align: center; margin: 5px 0; font-family: monospace; font-weight: 900; }

        .stock-row { display: grid; grid-template-columns: 35px 1.5fr 0.8fr 0.8fr 100px; align-items: center; background: var(--surface); margin-bottom: 4px; padding: 6px; border-radius: 6px; gap: 4px; border: 1px solid #222; font-size: 0.8rem; text-align: center; font-weight: 700; }
        
        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 20px; border-radius: 12px; width: 85%; max-width: 350px; z-index: 1000; border: 2px solid var(--primary); display: none; }
        .stock-footer { background: var(--surface-light); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px dashed var(--primary); text-align: center; font-weight: 800; line-height: 1.6; }
        .search-container { margin: 10px 0; position: relative; }
        #stock-search, #pos-search { background: #000; color: var(--primary); border: 1px solid var(--primary); padding-left: 35px; text-transform: uppercase; width: 100%; box-sizing: border-box;}
        .staff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

    <div id="login-overlay">
        <div class="login-box">
            <h1>STAFF LOGIN</h1>
            <div id="pin-screen" class="pin-display">****</div>
            <div class="grid-main" style="grid-template-columns: 1fr 1fr 1fr;">
                <button onclick="pP(1)">1</button><button onclick="pP(2)">2</button><button onclick="pP(3)">3</button>
                <button onclick="pP(4)">4</button><button onclick="pP(5)">5</button><button onclick="pP(6)">6</button>
                <button onclick="pP(7)">7</button><button onclick="pP(8)">8</button><button onclick="pP(9)">9</button>
                <button onclick="cP()" style="background:var(--danger)!important; color:#fff!important;">C</button>
                <button onclick="pP(0)">0</button>
                <button onclick="login()" style="background:var(--accent)!important;">OK</button>
            </div>
        </div>
    </div>

    <div id="app-body" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin: 0;">PAPA RON'S</h1>
            <div style="display: flex; gap: 5px;">
                <button onclick="manualSync()" style="width: auto; padding: 5px 10px; font-size: 0.6rem; background: #222 !important; color: var(--accent) !important;">SYNC ☁️</button>
                <button onclick="printUserSales()" style="width: auto; padding: 5px 10px; font-size: 0.7rem;">CASH UP</button>
                <button onclick="logout()" style="width: auto; padding: 5px 10px; background: #333!important; color: #fff!important;">LOCK</button>
            </div>
        </div>
        <p id="staff-tag" style="text-align:center; color: var(--primary); font-weight: 900; margin: 5px 0;"></p>

        <div class="grid-main">
            <button onclick="switchTab('pos-tab')">Sales</button>
            <button onclick="secureSwitch('menu-tab')">Builder</button>
            <button onclick="secureSwitch('stock-tab')">Stock</button>
            <button onclick="secureSwitch('report-tab')">Reports</button>
        </div>

        <div id="pos-tab" class="tab-content active-tab">
            <div id="trans-tabs"></div>
            <div class="search-container">
                <input type="text" id="pos-search" placeholder="SEARCH PRODUCTS..." oninput="renderPOS()">
            </div>
            <button onclick="createNewTransaction()" style="padding: 10px; margin-bottom: 5px; font-size: 1rem;">+ NEW TABLE</button>
            <div class="grid-main">
                <div class="category-grid" id="foodGrid"></div>
                <div class="category-grid" id="drinkGrid"></div>
            </div>
            <div id="cart-list"></div>
            <div id="total-view">R 0.00</div>
            <div class="grid-main">
                <button onclick="openTender()" style="height:60px; font-size: 1.2rem;">TENDER</button>
                <button onclick="printKitchenSlip()">Kitchen Slip</button>
                <button onclick="markAsWastage()" style="background:transparent !important; border:1px solid var(--warning) !important; color:var(--warning) !important; font-size:0.75rem;">Wastage</button>
                <button onclick="adminVoid()" style="background:transparent !important; border:1px solid var(--danger) !important; color:var(--danger) !important;">Void</button>
            </div>
            <button onclick="openStaffSaleModal()" style="margin-top: 10px; height: 50px; background: #555 !important; color: #fff !important; border: 2px solid var(--primary) !important;">STAFF SALE / TAB</button>
        </div>

        <div id="menu-tab" class="tab-content">
            <div style="background:var(--surface); padding:15px; border-radius:10px;">
                <h3>Product Builder</h3>
                <input type="text" id="m-name" placeholder="ITEM NAME">
                <div class="grid-main">
                    <input type="number" id="m-price" placeholder="Sell Price (R)">
                    <input type="number" id="m-cost" placeholder="Cost (R)">
                </div>
                <select id="m-cat"><option value="food">Food</option><option value="drink">Drink</option></select>
                <div id="ing-rows"><div style="display:flex; gap:4px;"><input type="text" class="i-name" placeholder="Ingredient"><input type="number" class="i-qty" placeholder="Qty"></div></div>
                <button onclick="addIngRow()" class="btn-small">+ Add Ingredient</button>
                <button onclick="saveNewProduct()" style="margin-top:10px;">SAVE PRODUCT</button>
            </div>
        </div>

        <div id="stock-tab" class="tab-content">
            <div style="background:var(--surface); padding:8px; border-radius:10px;">
                <button onclick="printFullValuationReport()">Full Valuation PDF</button>
                <div class="search-container">
                    <input type="text" id="stock-search" placeholder="SEARCH STOCK..." oninput="renderStock()">
                </div>
            </div>
            <div id="inventory-display" style="max-height:400px; overflow-y:auto;"></div>
            <div class="stock-footer" id="stock-summary"></div>
        </div>

        <div id="report-tab" class="tab-content">
            <div style="background:var(--surface); padding:15px; border-radius:10px;">
                <h3>Audit Reports</h3>
                <button onclick="generateReport('daily')">DAILY Z-REPORT (DETAIL)</button>
                <button onclick="generateReport('weekly')" style="margin-top:10px;">WEEKLY AUDIT</button>
                <hr style="margin:20px 0; border:1px solid #333;">
                <h3>Staff Tabs & Tips</h3>
                <select id="individual-staff-select"></select>
                <button onclick="printStaffReport(document.getElementById('individual-staff-select').value)">Print Staff Tab</button>
                <button onclick="handleTipPayout()" style="background:var(--accent) !important; margin-top:5px;">Pay Out Tips</button>
            </div>
        </div>
    </div>

    <div id="tender-modal" class="modal">
        <h1 id="cash-total-needed" style="text-align:center; color:var(--accent);"></h1>
        <input type="number" id="tender-amt" placeholder="Amount Received" oninput="calculateDifference()">
        <h2 id="diff-display" style="text-align:center;">Change: R0.00</h2>
        <div class="grid-main"><button onclick="finalizeSale('Cash')">CASH</button><button onclick="finalizeSale('Card')">CARD</button></div>
        <button onclick="closeModal()" style="margin-top:8px;">Back</button>
    </div>

    <div id="staff-sale-modal" class="modal">
        <h2 style="text-align:center;">SELECT STAFF</h2>
        <div id="staff-name-grid" class="staff-grid"></div>
        <button onclick="closeModal()" style="margin-top:15px;">CANCEL</button>
    </div>

    <script>
        const ADMIN_PIN = "1010";
        const STAFF_PINS = {"1010": "Sean", "7711": "Cats", "7777": "King Ron", "2266": "Local", "2255": "Jay", "2244": "Ben", "2233": "Lim", "2211": "Andisiwe", "1199": "Lungile", "1188": "Jon", "1177": "Megan", "1166": "Sweswe", "1155": "Siyamcela", "1144": "Luciano", "1133": "Tyran", "1122": "Sive", "2020": "Zuko", "1999": "Lee", "1992": "Jonice", "1234": "Beranise", "1111": "Momo", "2222": "Zet", "1529": "Marshall", "4444": "Hans", "2015": "Regan", "5555": "Don"};

        let pinStr = "";
        let currentUser = "";
        let inventory = JSON.parse(localStorage.getItem('pos_inv')) || {};
        let recipes = JSON.parse(localStorage.getItem('pos_rec')) || {};
        let transactions = JSON.parse(localStorage.getItem('pos_trans')) || [];
        let staffSales = JSON.parse(localStorage.getItem('pos_staff_sales')) || {}; 
        let staffTipLedger = JSON.parse(localStorage.getItem('pos_tips')) || {};
        let currentTransIdx = -1;

        function pP(n) { if(pinStr.length < 4) { pinStr += n; document.getElementById('pin-screen').textContent = "*".repeat(pinStr.length); } }
        function cP() { pinStr = ""; document.getElementById('pin-screen').textContent = "****"; }
        function logout() { location.reload(); }
        
        function login() {
            if(STAFF_PINS[pinStr]) {
                currentUser = STAFF_PINS[pinStr];
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-body').style.display = 'block';
                document.getElementById('staff-tag').textContent = "USER: " + currentUser.toUpperCase();
                startApp();
            } else { alert("WRONG PIN"); cP(); }
        }

        function startApp() {
            if (transactions.filter(t => t.status === 'active').length === 0) createNewTransaction();
            currentTransIdx = transactions.findIndex(t => t.status === 'active');
            populateStaffUI(); renderPOS(); renderStock();
        }

        function save() {
            localStorage.setItem('pos_inv', JSON.stringify(inventory));
            localStorage.setItem('pos_rec', JSON.stringify(recipes));
            localStorage.setItem('pos_trans', JSON.stringify(transactions));
            localStorage.setItem('pos_staff_sales', JSON.stringify(staffSales));
            localStorage.setItem('pos_tips', JSON.stringify(staffTipLedger));
        }

        function populateStaffUI() {
            const grid = document.getElementById('staff-name-grid'), select = document.getElementById('individual-staff-select');
            grid.innerHTML = ''; select.innerHTML = '';
            Object.values(STAFF_PINS).sort().forEach(name => {
                grid.innerHTML += `<button onclick="finalizeStaffSale('${name}')">${name}</button>`;
                select.innerHTML += `<option value="${name}">${name}</option>`;
            });
        }

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
        }

        function secureSwitch(id) {
            const pin = prompt("ADMIN PIN:");
            if (pin === ADMIN_PIN) switchTab(id); else alert("DENIED");
        }

        function renderPOS() {
            const f = document.getElementById('foodGrid'), d = document.getElementById('drinkGrid');
            const query = (document.getElementById('pos-search')?.value || "").toUpperCase();
            f.innerHTML = ''; d.innerHTML = '';
            Object.keys(inventory).forEach(key => {
                const itm = inventory[key];
                if(itm.category === 'ingredient' || (query && !itm.name.toUpperCase().includes(query))) return;
                const btn = document.createElement('div'); btn.className = `product-btn`;
                btn.innerHTML = `<div onclick="addToCart('${key}')"><b>${itm.name}</b><br>R${itm.price.toFixed(2)}</div>`;
                itm.category === 'food' ? f.appendChild(btn) : d.appendChild(btn);
            });
            updateCartUI();
        }

        function addToCart(key) { transactions[currentTransIdx].items.push({...inventory[key], code: key}); updateCartUI(); }

        function updateCartUI() {
            const list = document.getElementById('cart-list'); list.innerHTML = ''; let total = 0;
            transactions[currentTransIdx].items.forEach((it, i) => { 
                total += it.price; 
                list.innerHTML += `<div class="cart-row"><span>${it.name}</span><span>R${it.price.toFixed(2)} <button onclick="removeFromCart(${i})" style="background:var(--danger)!important; padding:2px 8px;">×</button></span></div>`; 
            });
            document.getElementById('total-view').textContent = `R ${total.toFixed(2)}`;
        }

        function removeFromCart(i) { transactions[currentTransIdx].items.splice(i, 1); updateCartUI(); }

        function openTender() { 
            const total = transactions[currentTransIdx].items.reduce((s, i) => s + i.price, 0); 
            if(total === 0) return; 
            document.getElementById('cash-total-needed').textContent = `TOTAL: R${total.toFixed(2)}`;
            document.getElementById('tender-modal').style.display = 'block'; 
        }

        function calculateDifference() { 
            const total = transactions[currentTransIdx].items.reduce((s, i) => s + i.price, 0), rec = parseFloat(document.getElementById('tender-amt').value) || 0;
            document.getElementById('diff-display').textContent = `Change: R${(rec - total).toFixed(2)}`;
        }

        function finalizeSale(method) {
            const t = transactions[currentTransIdx];
            const total = t.items.reduce((s, i) => s + i.price, 0), rec = parseFloat(document.getElementById('tender-amt').value) || total;
            t.total = total; t.tip = (method === 'Card') ? Math.max(0, rec - total) : 0;
            t.method = method; t.status = 'paid'; t.date = new Date().getTime(); t.staff = currentUser;
            if(t.tip > 0) staffTipLedger[currentUser] = (staffTipLedger[currentUser] || 0) + t.tip;
            
            t.items.forEach(it => {
                if(inventory[it.code]) inventory[it.code].stock--;
                if(recipes[it.code]) { for(let ing in recipes[it.code]) if(inventory[ing]) inventory[ing].stock -= recipes[it.code][ing]; }
            });
            save(); createNewTransaction(); closeModal(); alert("Sale Finalized");
        }

        function openStaffSaleModal() { document.getElementById('staff-sale-modal').style.display = 'block'; }

        function finalizeStaffSale(staffName) {
            const t = transactions[currentTransIdx]; if (t.items.length === 0) return;
            if (!staffSales[staffName]) staffSales[staffName] = [];
            t.items.forEach(it => {
                staffSales[staffName].push({ name: it.name, price: it.price, date: new Date().getTime() });
                if(inventory[it.code]) inventory[it.code].stock--;
            });
            save(); createNewTransaction(); closeModal(); alert("Added to Staff Account");
        }

        function markAsWastage() {
            const t = transactions[currentTransIdx]; if (t.items.length === 0) return;
            t.status = 'paid'; t.method = 'Wastage'; t.staff = currentUser; t.date = new Date().getTime();
            t.items.forEach(it => { if(inventory[it.code]) inventory[it.code].stock--; });
            save(); createNewTransaction(); alert("Wastage Recorded");
        }

        function generateReport(range) {
            const pin = prompt("ADMIN PIN:"); if(pin !== ADMIN_PIN) return;
            let startTime = 0, title = "", itemCounts = {};
            const now = new Date();

            if(range === 'daily') {
                const day = prompt("Date (YYYY-MM-DD) or blank for today:", now.toISOString().split('T')[0]);
                if(day === null) return;
                const d = day === "" ? new Date() : new Date(day);
                d.setHours(0,0,0,0); startTime = d.getTime();
                var sales = transactions.filter(t => t.status === 'paid' && t.date >= startTime && t.date < (startTime + 86400000));
                var dayStaffSales = {};
                for (let s in staffSales) {
                    let items = staffSales[s].filter(si => si.date >= startTime && si.date < (startTime + 86400000));
                    if(items.length > 0) { dayStaffSales[s] = items; items.forEach(i => itemCounts[i.name] = (itemCounts[i.name]||0)+1); }
                }
                title = "DAILY Z-REPORT: " + (day || "TODAY");
            } else {
                startTime = now.getTime() - (range === 'weekly' ? 604800000 : 2592000000);
                var sales = transactions.filter(t => t.status === 'paid' && t.date >= startTime);
                var dayStaffSales = staffSales;
                title = range.toUpperCase() + " AUDIT";
            }

            let cash = 0, card = 0, tips = 0, cost = 0, waste = 0, credit = 0;
            let ledgerRows = "";

            sales.forEach(s => {
                const time = new Date(s.date).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
                if(s.method === 'Cash') cash += s.total;
                if(s.method === 'Card') card += s.total;
                if(s.method === 'Wastage') waste += s.items.reduce((a,b) => a + (b.price||0), 0);
                tips += (s.tip||0);
                s.items.forEach(i => { cost += (i.cost||0); if(s.method !== 'Wastage') itemCounts[i.name] = (itemCounts[i.name]||0)+1; });
                if(s.method !== 'Wastage') ledgerRows += `<tr><td>${time}</td><td>${s.method}</td><td>${s.staff}</td><td style="text-align:right;">R${s.total.toFixed(2)}</td></tr>`;
            });

            let creditHTML = "";
            for(let s in dayStaffSales) {
                let total = dayStaffSales[s].reduce((a,b) => a + b.price, 0); credit += total;
                creditHTML += `<p style="display:flex; justify-content:space-between;"><span>${s}</span> <span>R${total.toFixed(2)}</span></p>`;
            }

            let topTenHTML = Object.entries(itemCounts).sort((a,b) => b[1]-a[1]).slice(0,10).map(e => `<tr><td>${e[0]}</td><td style="text-align:right;">x${e[1]}</td></tr>`).join('');
            
            let lowStockHTML = "";
            Object.values(inventory).forEach(i => { if(i.stock <= 5) lowStockHTML += `<tr><td>${i.name}</td><td style="text-align:right;">${i.stock.toFixed(1)}</td></tr>`; });

            let html = `<div style="font-family:monospace; width:300px; font-size:11px;">
                <h2 style="text-align:center;">PAPA RON'S</h2><h3 style="text-align:center;">${title}</h3><hr>
                <table style="width:100%; border-collapse:collapse;">${ledgerRows}</table><hr>
                <h4>STAFF CREDIT SALES</h4>${creditHTML || "<p>No staff sales</p>"}<hr>
                <div style="font-weight:bold; font-size:13px;">
                    <p style="display:flex; justify-content:space-between;"><span>CASH:</span><span>R${cash.toFixed(2)}</span></p>
                    <p style="display:flex; justify-content:space-between;"><span>CARD:</span><span>R${card.toFixed(2)}</span></p>
                    <p style="display:flex; justify-content:space-between;"><span>CREDIT:</span><span>R${credit.toFixed(2)}</span></p>
                    <p style="display:flex; justify-content:space-between; border-top:1px solid #000;"><span>GROSS:</span><span>R${(cash+card+credit).toFixed(2)}</span></p>
                    <p style="display:flex; justify-content:space-between; color:red;"><span>WASTE:</span><span>-R${waste.toFixed(2)}</span></p>
                    <p style="display:flex; justify-content:space-between;"><span>TIPS:</span><span>R${tips.toFixed(2)}</span></p>
                    <p style="display:flex; justify-content:space-between; border-top:1px solid #000;"><span>PROFIT:</span><span>R${(cash+card+credit-cost).toFixed(2)}</span></p>
                </div><hr>
                <h4 style="text-align:center;">🏆 TOP 10 SELLERS</h4><table style="width:100%">${topTenHTML}</table><hr>
                <div style="border:1px solid #000; padding:5px;">
                    <h4 style="text-align:center; margin:0;">⚠️ LOW STOCK</h4><table style="width:100%">${lowStockHTML || "<tr><td>ALL OK</td></tr>"}</table>
                </div>
            </div>`;

            const win = window.open('','','width=350'); win.document.write(html); win.document.close(); win.print();
        }

        function createNewTransaction() { transactions.push({id: transactions.length + 1, items: [], status:'active', date: new Date().getTime()}); currentTransIdx = transactions.length - 1; renderPOS(); }
        function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
        function addIngRow() { const d = document.createElement('div'); d.style.display="flex"; d.style.gap="4px"; d.innerHTML = `<input type="text" class="i-name" placeholder="Ingredient"><input type="number" class="i-qty" placeholder="Qty">`; document.getElementById('ing-rows').appendChild(d); }
        
        function saveNewProduct() {
            const name = document.getElementById('m-name').value.toUpperCase(), price = parseFloat(document.getElementById('m-price').value), cost = parseFloat(document.getElementById('m-cost').value) || 0, cat = document.getElementById('m-cat').value;
            const id = "P_" + Date.now();
            inventory[id] = { name, price, cost, category: cat, stock: 0 };
            save(); location.reload();
        }

        function renderStock() {
            const cont = document.getElementById('inventory-display'), query = (document.getElementById('stock-search')?.value || "").toUpperCase();
            cont.innerHTML = '';
            Object.keys(inventory).sort().forEach(key => {
                const itm = inventory[key]; if (query && !itm.name.toUpperCase().includes(query)) return;
                cont.innerHTML += `<div class="stock-row"><span></span><div style="text-align:left;"><b>${itm.name}</b></div><div>${itm.stock.toFixed(1)}</div><div>R${((itm.price||0)-(itm.cost||0)).toFixed(2)}</div><button onclick="addS('${key}')">+In</button></div>`;
            });
        }
        function addS(k) { const a = parseFloat(prompt("Add amount:")); if(a) { inventory[k].stock += a; save(); renderStock(); } }

        // Placeholder for Cloud Sync (Tied to your GitHub logic)
        function manualSync() { alert("Cloud Sync Initiated..."); save(); }
    </script>
</body>
