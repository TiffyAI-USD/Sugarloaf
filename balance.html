<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SUGARLOAF | PREMIER MASTER POS</title>
    <style>
        :root {
            --primary: #d4a373;
            --bg: #000000;
            --surface: #121212;
            --surface-light: #1e1e1e;
            --accent: #44ff44;
            --danger: #ff4444;
            --warning: #ff9800;
            --gold-grad: linear-gradient(145deg, #d4a373, #b38b59, #8a6d4b);
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); 
            color: #fff; 
            margin: 0; 
            padding: 8px; 
            overflow-x: hidden;
        }

        #login-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 9999; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .login-box { background: var(--surface); padding: 30px; border-radius: 15px; border: 2px solid var(--primary); width: 85%; max-width: 320px; text-align: center; }
        .pin-display { font-size: 2.5rem; letter-spacing: 12px; margin-bottom: 25px; color: var(--primary); font-weight: 900; background: #000; padding: 10px; border-radius: 8px; min-height: 50px; }

        h1 { text-align: center; color: var(--primary); font-size: 1.4rem; letter-spacing: 2px; text-transform: uppercase; margin: 10px 0; font-weight: 900; }
        h3 { color: var(--primary); margin: 0; font-weight: 800; text-transform: uppercase; font-size: 0.9rem; }

        input, button, select { 
            font-size: 0.9rem; 
            padding: 12px; 
            margin: 4px 0; 
            width: 100%; 
            border-radius: 6px; 
            box-sizing: border-box; 
            border: 1px solid #333; 
            font-weight: 800;
        }

        button { 
            background: var(--gold-grad) !important; 
            color: #000 !important; 
            border: none !important; 
            cursor: pointer; 
            text-transform: uppercase; 
            font-weight: 900; 
        }
        
        button:active { transform: scale(0.96); opacity: 0.8; }
        
        .grid-main { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tab-content { display: none; margin-top: 10px; animation: fadeIn 0.3s ease; }
        .active-tab { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .category-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); 
            gap: 6px; 
            background: var(--surface); 
            padding: 8px; 
            border-radius: 10px; 
            border: 1px solid #222;
            max-height: 300px;
            overflow-y: auto;
        }

        .product-btn { 
            position: relative; 
            min-height: 65px; 
            font-size: 0.75rem; 
            color: #000 !important; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center; 
            border-radius: 6px; 
            font-weight: 900;
            padding: 4px;
            cursor: pointer;
            text-transform: uppercase;
            background: var(--gold-grad);
            border-bottom: 3px solid #8a6d4b;
        }

        #trans-tabs { display: flex; gap: 4px; overflow-x: auto; padding: 4px 0; }
        .tab-btn { width: auto; padding: 8px 16px; background: #222 !important; color: #777 !important; white-space: nowrap; border: 1px solid #333 !important; font-size: 0.8rem; }
        .tab-btn.active { background: var(--gold-grad) !important; color: #000 !important; border-color: #fff !important; }

        #cart-list { background: var(--surface); border-radius: 8px; padding: 8px; margin: 8px 0; max-height: 200px; overflow-y: auto; border: 1px solid #222; }
        .cart-row { display: flex; justify-content: space-between; border-bottom: 1px solid #222; padding: 6px 0; align-items: center; font-size: 0.85rem; font-weight: 700; }
        #total-view { font-size: 2.5rem; color: var(--accent); text-align: center; margin: 5px 0; font-family: monospace; font-weight: 900; }

        .stock-row { display: grid; grid-template-columns: 35px 1.5fr 0.8fr 0.8fr 100px; align-items: center; background: var(--surface); margin-bottom: 4px; padding: 6px; border-radius: 6px; gap: 4px; border: 1px solid #222; font-size: 0.8rem; text-align: center; font-weight: 700; }
        .stock-status-low { color: var(--danger); font-weight: 900; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

        .modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #111; padding: 20px; border-radius: 12px; width: 85%; max-width: 350px; z-index: 1000; border: 2px solid var(--primary); display: none; }
        
        .stock-footer { background: var(--surface-light); padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px dashed var(--primary); text-align: center; font-weight: 800; line-height: 1.6; }
        
        .search-container { margin: 10px 0; position: relative; }
        #stock-search, #pos-search { background: #000; color: var(--primary); border: 1px solid var(--primary); padding-left: 35px; text-transform: uppercase; width: 100%; box-sizing: border-box;}

        .staff-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; max-height: 300px; overflow-y: auto; }
    </style>
</head>
<body>

    <audio id="snd-click" src="click.wav"></audio>
    <audio id="snd-sparkle" src="sparcle.wav"></audio>
    <audio id="snd-eat" src="eat.wav"></audio>

    <div id="login-overlay">
        <div class="login-box">
            <h1>STAFF LOGIN</h1>
            <div id="pin-screen" class="pin-display">****</div>
            <div class="grid-main" style="grid-template-columns: 1fr 1fr 1fr;">
                <button onclick="pP(1)">1</button><button onclick="pP(2)">2</button><button onclick="pP(3)">3</button>
                <button onclick="pP(4)">4</button><button onclick="pP(5)">5</button><button onclick="pP(6)">6</button>
                <button onclick="pP(7)">7</button><button onclick="pP(8)">8</button><button onclick="pP(9)">9</button>
                <button onclick="cP()" style="background:var(--danger)!important; color:#fff!important;">C</button>
                <button onclick="pP(0)">0</button>
                <button onclick="login()" style="background:var(--accent)!important;">OK</button>
            </div>
        </div>
    </div>

    <div id="app-body" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1 style="margin: 0;">SUGARLOAF</h1>
            <div style="display: flex; gap: 5px;">
                <button onclick="manualSync()" style="width: auto; padding: 5px 10px; font-size: 0.6rem; background: #222 !important; color: var(--accent) !important;">SYNC ☁️</button>
                <button onclick="printUserSales()" style="width: auto; padding: 5px 10px; font-size: 0.7rem;">CASH UP</button>
                <button onclick="logout()" style="width: auto; padding: 5px 10px; background: #333!important; color: #fff!important;">LOCK</button>
            </div>
        </div>
        <p id="staff-tag" style="text-align:center; color: var(--primary); font-weight: 900; margin: 5px 0;"></p>

        <div class="grid-main">
            <button onclick="switchTab('pos-tab')">Sales</button>
            <button onclick="secureSwitch('stock-tab')">Stock / Balance</button>
            <button onclick="secureSwitch('report-tab')">Reports</button>
            <button onclick="secureSwitch('menu-tab')">Builder</button>
        </div>

        <div id="pos-tab" class="tab-content active-tab">
            <div id="trans-tabs"></div>
            <div class="search-container">
                <input type="text" id="pos-search" placeholder="SEARCH MENU..." oninput="renderPOS()">
            </div>
            <button onclick="createNewTransaction()" style="padding: 10px; margin-bottom: 5px;">+ NEW TABLE</button>
            <div class="grid-main">
                <div class="category-grid" id="foodGrid"></div>
                <div class="category-grid" id="drinkGrid"></div>
            </div>
            <div id="cart-list"></div>
            <div id="total-view">R 0.00</div>
            <div class="grid-main">
                <button onclick="openTender()" style="height:60px; font-size: 1.2rem;">TENDER</button>
                <button onclick="printKitchenSlip()">Kitchen Slip</button>
                <button onclick="markAsWastage()" style="background:transparent !important; border:1px solid var(--warning) !important; color:var(--warning) !important;">Record Waste</button>
                <button onclick="adminVoid()" style="background:transparent !important; border:1px solid var(--danger) !important; color:var(--danger) !important;">Void Table</button>
            </div>
            <button onclick="openStaffSaleModal()" style="margin-top: 10px; height: 50px; background: #555 !important; color: #fff !important; border: 2px solid var(--primary) !important;">STAFF SALE / TAB</button>
        </div>

        <div id="stock-tab" class="tab-content">
            <div style="background:var(--surface); padding:10px; border-radius:10px; border: 2px solid var(--primary);">
                <h3>PURCHASE LOG (STOCK-IN)</h3>
                <input type="text" id="pur-name" placeholder="ITEM NAME">
                <div class="grid-main">
                    <input type="number" id="pur-qty" placeholder="QTY">
                    <input type="number" id="pur-cost" placeholder="TOTAL COST">
                </div>
                <button onclick="logPurchase()" style="background:var(--accent)!important;">ADD TO STOCK</button>
            </div>

            <div class="search-container">
                <input type="text" id="stock-search" placeholder="FILTER INVENTORY..." oninput="renderStock()">
            </div>

            <div style="display: flex; gap: 5px; margin-bottom: 10px;">
                <button onclick="openBalanceModal()" style="background:var(--warning)!important; color:#000!important;">BALANCE / COUNT</button>
                <button onclick="printFullValuationReport()">Full Valuation</button>
            </div>

            <div style="display: grid; grid-template-columns: 35px 1.5fr 0.8fr 0.8fr 100px; padding: 5px; font-weight: 900; color: var(--primary); font-size: 0.6rem; text-align: center;"><span>PICK</span><span>ITEM</span><span>SYSTEM</span><span>PROFIT</span><span>ACTION</span></div>
            <div id="inventory-display" style="max-height:300px; overflow-y:auto;"></div>
            <div class="stock-footer" id="stock-summary"></div>
        </div>

        <div id="report-tab" class="tab-content">
            <div style="background:var(--surface); padding:15px; border-radius:10px;">
                <h3>Financial Reports</h3>
                <div style="display:grid; gap:10px; margin-top:10px;">
                    <button onclick="generateReport('daily')">Daily Z-Report</button>
                    <button onclick="printDiscrepancyLog()">Stock Discrepancy Log (Over/Under)</button>
                    <button onclick="generateReport('monthly')">Monthly Sales Log</button>
                </div>
                <hr style="margin:20px 0; border:1px solid #333;">
                <h3>Staff Tabs</h3>
                <div style="display:grid; gap:10px;">
                    <button onclick="printStaffReport('all')" style="background:var(--warning) !important;">PRINT MASTER STAFF REPORT</button>
                    <select id="individual-staff-select" style="margin-top:5px;"></select>
                    <button onclick="printStaffReport(document.getElementById('individual-staff-select').value)">PRINT INDIVIDUAL REPORT</button>
                    <button onclick="clearStaffSales()" style="background:var(--danger) !important; color:#fff !important;">RESET ALL TABS</button>
                </div>
            </div>
        </div>

        <div id="menu-tab" class="tab-content">
            <div style="background:var(--surface); padding:15px; border-radius:10px;">
                <h3>Product / Recipe Builder</h3>
                <input type="text" id="m-name" placeholder="ITEM NAME">
                <div class="grid-main">
                    <input type="number" id="m-price" placeholder="Sell Price">
                    <input type="number" id="m-cost" placeholder="Direct Cost">
                </div>
                <select id="m-cat"><option value="food">Food</option><option value="drink">Drink</option></select>
                <div id="ing-rows"><div class="ing-grid" style="display:grid; grid-template-columns: 1.5fr 0.8fr; gap:5px; margin-top:5px;"><input type="text" class="i-name" placeholder="Ingredient"><input type="number" class="i-qty" placeholder="Qty"></div></div>
                <button onclick="addIngRow()" style="font-size:0.7rem; width:auto; margin:5px 0;">+ Add Ingredient</button>
                <button onclick="saveNewProduct()" style="margin-top:10px;">SAVE TO MENU</button>
            </div>
        </div>
    </div>

    <div id="balance-modal" class="modal">
        <h2 style="color:var(--warning); text-align:center;">STOCK COUNT</h2>
        <p id="balance-item-name" style="text-align:center; font-weight:900;"></p>
        <input type="number" id="physical-count" placeholder="Physical Count on Shelf">
        <button onclick="processBalance()" style="background:var(--warning)!important; color:#000!important;">CONFIRM BALANCE</button>
        <button onclick="closeModal()" style="margin-top:8px;">Cancel</button>
    </div>

    <div id="tender-modal" class="modal">
        <h1 id="cash-total-needed" style="text-align:center; color:var(--accent);"></h1>
        <input type="number" id="tender-amt" placeholder="Amount Received" oninput="calculateDifference()">
        <h2 id="diff-display" style="text-align:center; font-weight: 900;">Change: R0.00</h2>
        <div class="grid-main">
            <button onclick="finalizeSale('Cash')" style="height: 50px;">CASH</button>
            <button onclick="finalizeSale('Card')" style="height: 50px;">CARD</button>
        </div>
        <button onclick="closeModal()" style="margin-top:8px;">Back</button>
    </div>

    <div id="staff-sale-modal" class="modal">
        <h2 style="color:var(--primary); text-align:center;">STAFF TAB</h2>
        <div id="staff-name-grid" class="staff-grid"></div>
        <button onclick="closeModal()" style="margin-top:15px; background:#333 !important; color:#fff !important;">CANCEL</button>
    </div>

    <script>
        // CORE CONFIG
        const GH_REPO = "tiffyai-usd/Sugarloaf";
        const GH_PATH = "POS-data.json";

        // APP STATE
        let inventory = JSON.parse(localStorage.getItem('pos_inv')) || {};
        let recipes = JSON.parse(localStorage.getItem('pos_rec')) || {};
        let transactions = JSON.parse(localStorage.getItem('pos_trans')) || [];
        let purchaseLog = JSON.parse(localStorage.getItem('pos_purchases')) || [];
        let staffSales = JSON.parse(localStorage.getItem('pos_staff_sales')) || {};
        let staffTips = JSON.parse(localStorage.getItem('pos_staff_tips')) || {};
        let discrepancyLog = JSON.parse(localStorage.getItem('pos_discrepancies')) || [];
        
        let currentUser = "";
        let pinStr = "";
        let currentTransIdx = -1;
        const ADMIN_PIN = "1010";
        const STAFF_PINS = {"1010": "Sean", "7711": "Cats", "7777": "King Ron", "2266": "Local", "2255": "Jay", "2244": "Ben", "2233": "Lim", "2211": "Andisiwe", "1199": "Lungile", "1188": "Jon", "1177": "Megan", "1166": "Sweswe", "1155": "Siyamcela", "1144": "Luciano", "1133": "Tyran", "1122": "Sive", "2020": "Zuko", "1999": "Lee", "1992": "Jonice", "1234": "Beranise", "1111": "Momo", "2222": "Zet", "1529": "Marshall", "4444": "Hans", "2015": "Regan", "5555": "Don"};

        // LOGIN SYSTEM
        function pP(n) { if(pinStr.length < 4) { pinStr += n; document.getElementById('pin-screen').textContent = "*".repeat(pinStr.length); } }
        function cP() { pinStr = ""; document.getElementById('pin-screen').textContent = "****"; }
        function logout() { location.reload(); }
        function login() {
            if(STAFF_PINS[pinStr]) {
                currentUser = STAFF_PINS[pinStr];
                document.getElementById('login-overlay').style.display = 'none';
                document.getElementById('app-body').style.display = 'block';
                document.getElementById('staff-tag').textContent = "WAITER: " + currentUser.toUpperCase();
                playSnd('snd-sparkle');
                initApp();
            } else { alert("WRONG PIN"); cP(); }
        }

        function initApp() {
            if (transactions.filter(t => t.status === 'active').length === 0) createNewTransaction();
            currentTransIdx = transactions.findIndex(t => t.status === 'active');
            populateStaffUI();
            renderPOS(); renderStock(); updateValuation();
        }

        // SYNC & SAVE
        function save() {
            localStorage.setItem('pos_inv', JSON.stringify(inventory));
            localStorage.setItem('pos_rec', JSON.stringify(recipes));
            localStorage.setItem('pos_trans', JSON.stringify(transactions));
            localStorage.setItem('pos_purchases', JSON.stringify(purchaseLog));
            localStorage.setItem('pos_staff_sales', JSON.stringify(staffSales));
            localStorage.setItem('pos_staff_tips', JSON.stringify(staffTips));
            localStorage.setItem('pos_discrepancies', JSON.stringify(discrepancyLog));
            syncToCloud();
        }

        async function syncToCloud() {
            const token = localStorage.getItem('gh_token'); if(!token) return;
            const data = { inventory, recipes, transactions, purchaseLog, staffSales, staffTips, discrepancyLog, lastSync: new Date().toISOString() };
            try {
                const getRes = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, { headers: { "Authorization": `token ${token}` } });
                const fileInfo = await getRes.json();
                await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`, {
                    method: "PUT",
                    headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
                    body: JSON.stringify({ message: "Master Sync", content: btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2)))), sha: fileInfo.sha })
                });
            } catch(e) { console.error("Sync Failed", e); }
        }

        function manualSync() { 
            let t = prompt("ENTER TOKEN:"); 
            if(t) { localStorage.setItem('gh_token', t); syncToCloud().then(() => alert("SYNCED")); } 
        }

        // STOCK BALANCER (OVER/UNDER LOGIC)
        function openBalanceModal() {
            const checked = document.querySelectorAll('.stock-check:checked');
            if(checked.length === 0) return alert("Select one item to balance.");
            const key = checked[0].value;
            document.getElementById('balance-item-name').textContent = inventory[key].name;
            document.getElementById('balance-modal').style.display = 'block';
        }

        function processBalance() {
            const pin = prompt("ADMIN PIN TO OVERRIDE STOCK:");
            if(pin !== ADMIN_PIN) return alert("DENIED");

            const checked = document.querySelectorAll('.stock-check:checked');
            const key = checked[0].value;
            const itm = inventory[key];
            const physical = parseFloat(document.getElementById('physical-count').value);
            const system = itm.stock;
            const diff = physical - system;

            if(isNaN(physical)) return alert("Enter count");

            // Log the discrepancy
            discrepancyLog.push({
                date: new Date().getTime(),
                name: itm.name,
                system: system,
                physical: physical,
                diff: diff,
                randLoss: diff * (itm.cost || 0),
                staff: currentUser
            });

            // Adjust the system to match reality
            itm.stock = physical;

            save(); renderStock(); closeModal();
            alert(`Stock balanced. Discrepancy of ${diff.toFixed(1)} recorded.`);
        }

        function printDiscrepancyLog() {
            let win = window.open('', '', 'width=600,height=800');
            let rows = discrepancyLog.map(d => `
                <tr>
                    <td>${new Date(d.date).toLocaleString()}</td>
                    <td>${d.name}</td>
                    <td>${d.system.toFixed(1)}</td>
                    <td>${d.physical.toFixed(1)}</td>
                    <td style="color:${d.diff < 0 ? 'red' : 'green'}">${d.diff.toFixed(1)}</td>
                    <td>R${d.randLoss.toFixed(2)}</td>
                </tr>
            `).join('');

            win.document.write(`
                <html><body style="font-family:monospace; padding:20px;">
                <h2>STOCK DISCREPANCY REPORT (OVER/UNDER)</h2>
                <table border="1" style="width:100%; border-collapse:collapse; text-align:center;">
                    <thead><tr><th>Date</th><th>Item</th><th>System</th><th>Physical</th><th>Diff</th><th>Value</th></tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <p>Note: Positive diff means items were "Over" (Forgot to ring up). Negative means "Under" (Loss/Theft).</p>
                </body></html>
            `);
            win.document.close(); win.print();
        }

        // POS CORE
        function renderPOS() {
            const f = document.getElementById('foodGrid'); const d = document.getElementById('drinkGrid');
            const query = document.getElementById('pos-search').value.toUpperCase();
            f.innerHTML = ''; d.innerHTML = '';
            
            Object.keys(inventory).forEach(key => {
                if(inventory[key].category === 'ingredient') return;
                if (query && !inventory[key].name.toUpperCase().includes(query)) return;
                const btn = document.createElement('div'); btn.className = 'product-btn';
                btn.innerHTML = `<div onclick="addToCart('${key}')"><b>${inventory[key].name}</b><br>R${inventory[key].price.toFixed(2)}</div>`;
                inventory[key].category === 'food' ? f.appendChild(btn) : d.appendChild(btn);
            });

            const tTabs = document.getElementById('trans-tabs'); tTabs.innerHTML = '';
            transactions.forEach((t, i) => {
                if(t.status !== 'active') return;
                const btn = document.createElement('button'); btn.className = `tab-btn ${i === currentTransIdx ? 'active' : ''}`;
                btn.textContent = `Table ${t.id}`; btn.onclick = () => { currentTransIdx = i; renderPOS(); }; tTabs.appendChild(btn);
            });
            updateCartUI();
        }

        function addToCart(key) {
            transactions[currentTransIdx].items.push({...inventory[key], code: key});
            playSnd('snd-click');
            updateCartUI();
            save();
        }

        function updateCartUI() {
            const list = document.getElementById('cart-list'); list.innerHTML = ''; let total = 0;
            if(transactions[currentTransIdx]) {
                transactions[currentTransIdx].items.forEach((it, i) => {
                    total += it.price;
                    list.innerHTML += `<div class="cart-row"><span>${it.name}</span><span>R${it.price.toFixed(2)} <button onclick="removeFromCart(${i})" style="width:auto; padding:2px 8px; background:var(--danger)!important;">×</button></span></div>`;
                });
            }
            document.getElementById('total-view').textContent = `R ${total.toFixed(2)}`;
        }

        function removeFromCart(i) { transactions[currentTransIdx].items.splice(i, 1); updateCartUI(); save(); }

        function openTender() {
            const total = transactions[currentTransIdx].items.reduce((s, i) => s + i.price, 0);
            if(total <= 0) return;
            document.getElementById('cash-total-needed').textContent = `TOTAL: R${total.toFixed(2)}`;
            document.getElementById('tender-modal').style.display = 'block';
        }

        function calculateDifference() {
            const total = transactions[currentTransIdx].items.reduce((s, i) => s + i.price, 0);
            const received = parseFloat(document.getElementById('tender-amt').value) || 0;
            const diff = received - total;
            document.getElementById('diff-display').textContent = diff >= 0 ? `Change: R${diff.toFixed(2)}` : `Short: R${Math.abs(diff).toFixed(2)}`;
            document.getElementById('diff-display').style.color = diff >= 0 ? 'var(--accent)' : 'var(--danger)';
        }

        function finalizeSale(method) {
            const t = transactions[currentTransIdx];
            const total = t.items.reduce((s, i) => s + i.price, 0);
            t.total = total; t.method = method; t.status = 'paid'; t.staff = currentUser; t.date = new Date().getTime();

            // Deduct Stock
            t.items.forEach(it => {
                if(inventory[it.code]) inventory[it.code].stock--;
                if(recipes[it.code]) {
                    for(let ing in recipes[it.code]) {
                        if(inventory[ing]) inventory[ing].stock -= recipes[it.code][ing];
                    }
                }
            });

            printReceipt(t);
            save(); createNewTransaction(); closeModal(); playSnd('snd-eat');
        }

        // STOCK RENDERING
        function renderStock() {
            const cont = document.getElementById('inventory-display');
            const search = document.getElementById('stock-search').value.toUpperCase();
            cont.innerHTML = '';
            
            Object.keys(inventory).sort().forEach(key => {
                const itm = inventory[key];
                if(search && !itm.name.toUpperCase().includes(search)) return;
                const stockClass = itm.stock <= 5 ? 'stock-status-low' : '';
                cont.innerHTML += `<div class="stock-row"><input type="checkbox" class="stock-check" value="${key}"><div style="text-align:left;"><b>${itm.name}</b><br><small>Cost: R${(itm.cost||0).toFixed(2)}</small></div><div class="${stockClass}">${itm.stock.toFixed(1)}</div><div>R${((itm.price||0) - (itm.cost||0)).toFixed(2)}</div><button onclick="openStockIn('${key}')" style="font-size:0.6rem; width:auto;">+Stock</button></div>`;
            });
            updateValuation();
        }

        function logPurchase() {
            const name = document.getElementById('pur-name').value.toUpperCase();
            const qty = parseFloat(document.getElementById('pur-qty').value);
            const cost = parseFloat(document.getElementById('pur-cost').value);
            if(!name || !qty) return;
            const key = name.replace(/\s+/g, '_');
            if(!inventory[key]) inventory[key] = { name, stock: 0, cost: 0, price: 0, category: 'ingredient' };
            inventory[key].stock += qty;
            inventory[key].cost = cost / qty;
            purchaseLog.push({ name, qty, cost, date: new Date().getTime() });
            save(); renderStock();
        }

        // UTILS
        function playSnd(id) { document.getElementById(id).play().catch(e=>{}); }
        function closeModal() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
        function createNewTransaction() {
            transactions.push({id: transactions.length + 1, items: [], status:'active', date: new Date().getTime()});
            currentTransIdx = transactions.length - 1;
            renderPOS();
        }
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById(id).classList.add('active-tab');
        }
        function secureSwitch(id) {
            const p = prompt("ADMIN PIN:");
            if(p === ADMIN_PIN) switchTab(id); else alert("DENIED");
        }

        function populateStaffUI() {
            const grid = document.getElementById('staff-name-grid');
            const sel = document.getElementById('individual-staff-select');
            grid.innerHTML = ''; sel.innerHTML = '';
            Object.values(STAFF_PINS).sort().forEach(n => {
                grid.innerHTML += `<button onclick="finalizeStaffSale('${n}')">${n}</button>`;
                sel.innerHTML += `<option value="${n}">${n}</option>`;
            });
        }

        function finalizeStaffSale(name) {
            const t = transactions[currentTransIdx];
            if(!staffSales[name]) staffSales[name] = [];
            t.items.forEach(it => {
                staffSales[name].push({ name: it.name, price: it.price, date: new Date().getTime() });
                if(inventory[it.code]) inventory[it.code].stock--;
            });
            save(); createNewTransaction(); closeModal();
        }

        function printStaffReport(filter) {
            let win = window.open('', '', 'width=400,height=600');
            let content = `<h2>STAFF TABS</h2>`;
            if(filter === 'all') {
                for(let s in staffSales) {
                    let t = staffSales[s].reduce((sum, i) => sum + i.price, 0);
                    content += `<p>${s}: R${t.toFixed(2)}</p>`;
                }
            } else {
                content += `<h3>${filter}</h3>`;
                staffSales[filter].forEach(i => content += `<li>${i.name} - R${i.price.toFixed(2)}</li>`);
            }
            win.document.write(content); win.document.close(); win.print();
        }

        function printReceipt(t) {
            let win = window.open('', '', 'width=300,height=500');
            win.document.write(`<pre style="font-family:monospace;">
SUGARLOAF POS
----------------
Table: ${t.id}
Waiter: ${t.staff}
----------------
${t.items.map(i => `${i.name.padEnd(15)} R${i.price.toFixed(2)}`).join('\n')}
----------------
TOTAL: R${t.total.toFixed(2)}
METHOD: ${t.method}
----------------
${new Date(t.date).toLocaleString()}
            </pre>`);
            win.document.close(); win.print();
        }

        function updateValuation() {
            let costVal = 0; let retailVal = 0;
            Object.values(inventory).forEach(itm => {
                costVal += (itm.stock * (itm.cost || 0));
                retailVal += (itm.stock * (itm.price || 0));
            });
            document.getElementById('stock-summary').innerHTML = `STOCK COST: R${costVal.toFixed(2)} | POTENTIAL PROFIT: R${(retailVal - costVal).toFixed(2)}`;
        }

        function addIngRow() {
            const div = document.createElement('div'); div.className="ing-grid"; div.style="display:grid; grid-template-columns: 1.5fr 0.8fr; gap:5px; margin-top:5px;";
            div.innerHTML = `<input type="text" class="i-name" placeholder="Ingredient"><input type="number" class="i-qty" placeholder="Qty">`;
            document.getElementById('ing-rows').appendChild(div);
        }

        function saveNewProduct() {
            const name = document.getElementById('m-name').value.toUpperCase();
            const price = parseFloat(document.getElementById('m-price').value);
            const cost = parseFloat(document.getElementById('m-cost').value) || 0;
            const cat = document.getElementById('m-cat').value;
            const id = "P_" + Date.now();
            let recipe = {};
            document.querySelectorAll('.i-name').forEach((n, i) => {
                if(n.value) recipe[n.value.toUpperCase().replace(/\s+/g, '_')] = parseFloat(document.querySelectorAll('.i-qty')[i].value);
            });
            inventory[id] = { name, price, cost, category: cat, stock: 0 };
            if(Object.keys(recipe).length > 0) recipes[id] = recipe;
            save(); location.reload();
        }
    </script>
</body>
</html>
